name: media-upload-manager

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-media-groups: &media-groups
  - ${MEDIA_GID:-${APP_GID:-1000}}

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Media Upload Manager}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_MAINTENANCE_DRIVER: cache
  APP_MAINTENANCE_STORE: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required},nginx,127.0.0.1
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-media_upload_manager}
  DB_USERNAME: ${MYSQL_USER:-media_upload_manager}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-240}
  TMDB_API_TOKEN: ${TMDB_API_TOKEN:?TMDB_API_TOKEN is required}
  TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
  TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
  TMDB_CACHE_TTL: ${TMDB_CACHE_TTL:-86400}
  TMDB_CONNECT_TIMEOUT: ${TMDB_CONNECT_TIMEOUT:-3}
  TMDB_REQUEST_TIMEOUT: ${TMDB_REQUEST_TIMEOUT:-10}
  MEDIA_DISKS: ${MEDIA_DISKS:-nas_a,nas_b,nas_c}
  MEDIA_DEFAULT_RESERVE_GIB: ${MEDIA_DEFAULT_RESERVE_GIB:-20}
  MEDIA_REQUIRE_MOUNTPOINT: "true"
  MEDIA_DISK_NAS_A_LABEL: ${MEDIA_DISK_NAS_A_LABEL:-Movies A}
  MEDIA_DISK_NAS_A_PATH: ${MEDIA_DISK_NAS_A_PATH:-}
  MEDIA_DISK_NAS_A_MOVIES_PATH: ${MEDIA_DISK_NAS_A_MOVIES_PATH:-${MEDIA_DISK_NAS_A_PATH:?MEDIA_DISK_NAS_A_MOVIES_PATH or MEDIA_DISK_NAS_A_PATH is required}}
  MEDIA_DISK_NAS_A_RESERVE_GIB: ${MEDIA_DISK_NAS_A_RESERVE_GIB:-20}
  MEDIA_DISK_NAS_B_LABEL: ${MEDIA_DISK_NAS_B_LABEL:-Movies B}
  MEDIA_DISK_NAS_B_PATH: ${MEDIA_DISK_NAS_B_PATH:-}
  MEDIA_DISK_NAS_B_MOVIES_PATH: ${MEDIA_DISK_NAS_B_MOVIES_PATH:-${MEDIA_DISK_NAS_B_PATH:?MEDIA_DISK_NAS_B_MOVIES_PATH or MEDIA_DISK_NAS_B_PATH is required}}
  MEDIA_DISK_NAS_B_RESERVE_GIB: ${MEDIA_DISK_NAS_B_RESERVE_GIB:-20}
  MEDIA_DISK_NAS_C_LABEL: ${MEDIA_DISK_NAS_C_LABEL:-Movies C}
  MEDIA_DISK_NAS_C_PATH: ${MEDIA_DISK_NAS_C_PATH:-}
  MEDIA_DISK_NAS_C_MOVIES_PATH: ${MEDIA_DISK_NAS_C_MOVIES_PATH:-${MEDIA_DISK_NAS_C_PATH:?MEDIA_DISK_NAS_C_MOVIES_PATH or MEDIA_DISK_NAS_C_PATH is required}}
  MEDIA_DISK_NAS_C_RESERVE_GIB: ${MEDIA_DISK_NAS_C_RESERVE_GIB:-20}
  UPLOAD_TUS_PUBLIC_PATH: /uploads/tus/
  TUS_INTERNAL_URL: http://tusd:1080/uploads/tus/
  TUS_HOOK_SECRET: ${TUS_HOOK_SECRET:?TUS_HOOK_SECRET is required}
  TUS_METADATA_PATH: /var/lib/tusd
  UPLOAD_CHUNK_SIZE_BYTES: "67108864"
  UPLOAD_RETRY_DELAYS_MS: 0,3000,5000,10000,20000
  UPLOAD_INTERNAL_CONNECT_TIMEOUT_SECONDS: ${UPLOAD_INTERNAL_CONNECT_TIMEOUT_SECONDS:-2}
  UPLOAD_INTERNAL_TIMEOUT_SECONDS: ${UPLOAD_INTERNAL_TIMEOUT_SECONDS:-5}
  UPLOAD_TOKEN_TTL_SECONDS: ${UPLOAD_TOKEN_TTL_SECONDS:-900}
  UPLOAD_TOKEN_REFRESH_LEEWAY_SECONDS: ${UPLOAD_TOKEN_REFRESH_LEEWAY_SECONDS:-60}
  UPLOAD_INACTIVITY_SECONDS: ${UPLOAD_INACTIVITY_SECONDS:-604800}
  UPLOAD_FINGERPRINT_WINDOW_BYTES: ${UPLOAD_FINGERPRINT_WINDOW_BYTES:-1048576}
  FFPROBE_BINARY: /usr/bin/ffprobe
  FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-120}
  FFPROBE_MAX_OUTPUT_BYTES: ${FFPROBE_MAX_OUTPUT_BYTES:-1048576}
  FFPROBE_MAX_STREAMS: ${FFPROBE_MAX_STREAMS:-64}
  UPLOAD_PROCESSING_JOB_TIMEOUT_SECONDS: ${UPLOAD_PROCESSING_JOB_TIMEOUT_SECONDS:-180}
  UPLOAD_PROCESSING_JOB_UNIQUE_SECONDS: ${UPLOAD_PROCESSING_JOB_UNIQUE_SECONDS:-3600}
  UPLOAD_PROCESSING_JOB_BACKOFF_SECONDS: ${UPLOAD_PROCESSING_JOB_BACKOFF_SECONDS:-15,60,180}
  UPLOAD_PROCESSING_POLL_INTERVAL_MS: ${UPLOAD_PROCESSING_POLL_INTERVAL_MS:-1500}
  PULSE_ENABLED: "true"
  PULSE_EXCEPTION_CONTEXT_ENABLED: ${PULSE_EXCEPTION_CONTEXT_ENABLED:-true}
  PULSE_STORAGE_KEEP: ${PULSE_STORAGE_KEEP:-7 days}
  PULSE_INGEST_KEEP: ${PULSE_INGEST_KEEP:-7 days}
  PULSE_SERVER_NAME: ${PULSE_SERVER_NAME:-media-upload-manager}

x-app-service: &app-service
  image: ${APP_IMAGE:?APP_IMAGE is required}
  user: ${APP_UID:-1000}:${APP_GID:-1000}
  environment: *app-environment
  volumes:
    - tus-metadata:/var/lib/tusd
    - ${MEDIA_DISK_NAS_A_MOVIES_PATH:-${MEDIA_DISK_NAS_A_PATH:?MEDIA_DISK_NAS_A_MOVIES_PATH or MEDIA_DISK_NAS_A_PATH is required}}:${MEDIA_DISK_NAS_A_MOVIES_PATH:-${MEDIA_DISK_NAS_A_PATH:?MEDIA_DISK_NAS_A_MOVIES_PATH or MEDIA_DISK_NAS_A_PATH is required}}
    - ${MEDIA_DISK_NAS_B_MOVIES_PATH:-${MEDIA_DISK_NAS_B_PATH:?MEDIA_DISK_NAS_B_MOVIES_PATH or MEDIA_DISK_NAS_B_PATH is required}}:${MEDIA_DISK_NAS_B_MOVIES_PATH:-${MEDIA_DISK_NAS_B_PATH:?MEDIA_DISK_NAS_B_MOVIES_PATH or MEDIA_DISK_NAS_B_PATH is required}}
    - ${MEDIA_DISK_NAS_C_MOVIES_PATH:-${MEDIA_DISK_NAS_C_PATH:?MEDIA_DISK_NAS_C_MOVIES_PATH or MEDIA_DISK_NAS_C_PATH is required}}:${MEDIA_DISK_NAS_C_MOVIES_PATH:-${MEDIA_DISK_NAS_C_PATH:?MEDIA_DISK_NAS_C_MOVIES_PATH or MEDIA_DISK_NAS_C_PATH is required}}
  restart: unless-stopped
  logging: *bounded-logging
  networks:
    - backend

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-media_upload_manager}
      MYSQL_USER: ${MYSQL_USER:-media_upload_manager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *bounded-logging
    networks:
      - backend

  volume-init:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    user: "0:0"
    command: ["sh", "-c", "chown -R ${APP_UID:-1000}:${APP_GID:-1000} /var/lib/tusd"]
    volumes:
      - tus-metadata:/var/lib/tusd
    restart: "no"
    logging: *bounded-logging
    networks:
      - backend

  migrate:
    <<: *app-service
    group_add: *media-groups
    command: ["sh", "-c", "php artisan migrate --force --isolated && php artisan media:disks:check"]
    depends_on:
      mysql:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *app-service
    group_add: *media-groups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *app-service
    group_add: *media-groups
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=0", "--timeout=180", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app-service
    group_add: *media-groups
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  pulse:
    <<: *app-service
    command: ["php", "artisan", "pulse:check"]
    volumes: []
    depends_on:
      migrate:
        condition: service_completed_successfully

  tusd:
    image: tusproject/tusd:v2.10.0
    user: ${APP_UID:-1000}:${APP_GID:-1000}
    group_add: *media-groups
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/uploads/tus/
      - -behind-proxy
      - -disable-download
      - -disable-cors
      - -upload-dir=/var/lib/tusd
      - -hooks-http=http://nginx:8081/internal/tus/hooks
      - -hooks-http-timeout=5s
      - -hooks-http-retry=3
      - -hooks-http-backoff=1s
      - -hooks-enabled-events=pre-create,post-create,post-receive,post-finish,pre-terminate,post-terminate
      - -progress-hooks-interval=5s
    volumes:
      - tus-metadata:/var/lib/tusd
      - ${MEDIA_DISK_NAS_A_MOVIES_PATH:-${MEDIA_DISK_NAS_A_PATH:?MEDIA_DISK_NAS_A_MOVIES_PATH or MEDIA_DISK_NAS_A_PATH is required}}:${MEDIA_DISK_NAS_A_MOVIES_PATH:-${MEDIA_DISK_NAS_A_PATH:?MEDIA_DISK_NAS_A_MOVIES_PATH or MEDIA_DISK_NAS_A_PATH is required}}
      - ${MEDIA_DISK_NAS_B_MOVIES_PATH:-${MEDIA_DISK_NAS_B_PATH:?MEDIA_DISK_NAS_B_MOVIES_PATH or MEDIA_DISK_NAS_B_PATH is required}}:${MEDIA_DISK_NAS_B_MOVIES_PATH:-${MEDIA_DISK_NAS_B_PATH:?MEDIA_DISK_NAS_B_MOVIES_PATH or MEDIA_DISK_NAS_B_PATH is required}}
      - ${MEDIA_DISK_NAS_C_MOVIES_PATH:-${MEDIA_DISK_NAS_C_PATH:?MEDIA_DISK_NAS_C_MOVIES_PATH or MEDIA_DISK_NAS_C_PATH is required}}:${MEDIA_DISK_NAS_C_MOVIES_PATH:-${MEDIA_DISK_NAS_C_PATH:?MEDIA_DISK_NAS_C_MOVIES_PATH or MEDIA_DISK_NAS_C_PATH is required}}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *bounded-logging
    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    environment:
      TUS_HOOK_SECRET: ${TUS_HOOK_SECRET:?TUS_HOOK_SECRET is required}
    depends_on:
      app:
        condition: service_healthy
      tusd:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging
    networks:
      - backend
      - edge

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logging
    networks:
      - edge

volumes:
  mysql-data:
  tus-metadata:

networks:
  backend:
  edge:
