# Include inside the public HTTPS application server.
location = /internal/tus/authorize {
    return 404;
}

location = /internal/tus/hooks {
    return 404;
}

location ^~ /uploads/tus/ {
    if ($request_method = OPTIONS) {
        add_header Tus-Resumable "1.0.0" always;
        add_header Tus-Version "1.0.0" always;
        add_header Tus-Extension "creation,termination" always;
        return 204;
    }

    limit_except POST PATCH HEAD DELETE OPTIONS {
        deny all;
    }

    auth_request /_mum_tus_authorize;

    client_max_body_size 65m;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Media-Upload-Expiry "";
    proxy_set_header Connection "";

    proxy_pass http://tusd:1080;
}

location = /_mum_tus_authorize {
    internal;
    include fastcgi_params;
    client_max_body_size 65m;
    fastcgi_pass_request_body off;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param REQUEST_URI /internal/tus/authorize;
    fastcgi_param QUERY_STRING "";
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_ORIGINAL_METHOD $request_method;
    fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
    fastcgi_param HTTP_TUS_RESUMABLE $http_tus_resumable;
    fastcgi_param HTTP_UPLOAD_LENGTH $http_upload_length;
    fastcgi_param HTTP_UPLOAD_OFFSET $http_upload_offset;
    fastcgi_param HTTP_UPLOAD_METADATA $http_upload_metadata;
    fastcgi_param HTTP_UPLOAD_DEFER_LENGTH $http_upload_defer_length if_not_empty;
    fastcgi_param HTTP_UPLOAD_CONCAT $http_upload_concat if_not_empty;
    fastcgi_pass app:9000;
}
